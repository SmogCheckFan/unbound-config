##############################################################################
# Unbound DNS resolver configuration
#
# Role:     Local recursive, caching, DNSSEC-validating resolver.
#           Listens on 127.0.0.1:5335 — the usual upstream for Pi-hole/AdGuard.
# Tested:   Debian (stable), Intel Xeon E3-1246 v3, 8 GB RAM.
# Validate: sudo unbound-checkconf /etc/unbound/unbound.conf
#
# Note: the outgoing-range / per-thread query settings below open many sockets.
# If the service fails to start, raise LimitNOFILE in the systemd unit (see README).
##############################################################################

server:

    # ===== NETWORK / LISTENING =====
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow       # loopback clients only
    access-control: 0.0.0.0/0 refuse         # refuse everyone else
    discard-timeout: 0

    # ===== THREADING =====
    num-threads: 4                           # set to your physical core count
    so-reuseport: yes
    minimal-responses: yes
    verbosity: 0                             # raise to 1+ for debugging

    # ===== DNSSEC =====
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    module-config: "validator iterator"
    harden-dnssec-stripped: yes
    harden-algo-downgrade: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-referral-path: no                 # default; off for performance
    aggressive-nsec: yes
    qname-minimisation: yes
    val-permissive-mode: no                  # fail closed on validation errors

    # ===== CACHE =====
    msg-cache-size: 512m
    rrset-cache-size: 1024m
    neg-cache-size: 64m
    key-cache-size: 128m
    infra-cache-numhosts: 20000
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8
    prefetch: yes
    prefetch-key: yes
    target-fetch-policy: "5 4 3 2 0"
    serve-expired: yes
    serve-expired-ttl: 2592000               # serve stale up to 30 days if needed
    serve-expired-client-timeout: 0
    #serve-expired-reply-ttl: 30

    # Respect real TTLs
    cache-min-ttl: 600
    cache-max-ttl: 7776000
    cache-max-negative-ttl: 604800
    cache-min-negative-ttl: 3600

    # ===== PERFORMANCE =====
    outgoing-range: 16384                    # high; needs a raised open-file limit
    num-queries-per-thread: 8192
    jostle-timeout: 100
    so-rcvbuf: 16m
    so-sndbuf: 16m
    incoming-num-tcp: 200
    outgoing-num-tcp: 200
    outgoing-port-permit: 1024-65535

    # ===== PROTOCOLS =====
    do-ip4: yes
    do-ip6: no                               # enable if the host has working IPv6
    do-udp: yes
    do-tcp: yes

    # Fragmentation-safe EDNS
    edns-buffer-size: 1232
    max-udp-size: 1232

    # ===== INFRASTRUCTURE CACHE =====
    infra-cache-min-rtt: 10
    infra-cache-max-rtt: 5000

    # ===== ROOT SERVERS =====
    root-hints: "/var/lib/unbound/root.hints"

    # ===== SECURITY HARDENING =====
    hide-identity: yes
    hide-version: yes
    unwanted-reply-threshold: 10000
    do-not-query-localhost: yes
    harden-large-queries: yes

    # ===== STATISTICS =====
    extended-statistics: yes
    statistics-cumulative: yes
    statistics-interval: 0                    # 0 = on-demand via unbound-control

    # ===== OPTIONAL OPERATIONAL SETTINGS =====
    # Uncomment as needed. Defaults below match a typical Debian install.
    #username: "unbound"
    #directory: "/etc/unbound"
    #use-syslog: yes
    #log-time-ascii: yes
    #log-queries: no
    #pidfile: "/run/unbound.pid"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1

# ===== OPTIONAL FORWARDING =====
# Uncomment to forward instead of resolving recursively (e.g. to an upstream
# resolver). Recursive resolution is used by default when this is left disabled.
#forward-zone:
#    name: "."
#    forward-addr: 129.250.35.250
#    forward-first: yes
