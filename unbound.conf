server:
    # ===== LISTENING =====
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    discard-timeout: 0
    # ===== THREADING =====
    num-threads: 4
    so-reuseport: yes
    minimal-responses: yes
    verbosity: 0
    # ===== DNSSEC =====
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    module-config: "validator iterator"
    harden-dnssec-stripped: yes
    harden-algo-downgrade: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    aggressive-nsec: yes
    qname-minimisation: yes

    # ===== CACHE =====
    msg-cache-size: 512m
    rrset-cache-size: 1024m
    neg-cache-size: 64m
    key-cache-size: 128m
    infra-cache-numhosts: 20000
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    prefetch: yes
    prefetch-key: yes
    target-fetch-policy: "5 4 3 2 0"
    serve-expired: yes
    serve-expired-ttl: 2592000
    serve-expired-client-timeout: 0
    #serve-expired-reply-ttl: 30
    # Respect real TTLs 
    cache-min-ttl: 600
    cache-max-ttl: 7776000
    cache-max-negative-ttl: 604800
    cache-min-negative-ttl: 3600
    # ===== PERFORMANCE =====
    outgoing-range: 16384
    num-queries-per-thread: 8192
    jostle-timeout: 100

    so-rcvbuf: 16m
    so-sndbuf: 16m

    incoming-num-tcp: 200
    outgoing-num-tcp: 200
    outgoing-port-permit: 1024-65535

    # ===== PROTOCOLS =====
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Fragmentation-safe EDNS
    edns-buffer-size: 1232
    max-udp-size: 1232

    # ===== INFRASTRUCTURE CACHE =====
    infra-cache-min-rtt: 10
    infra-cache-max-rtt: 5000

    # ===== ROOT SERVERS =====
    root-hints: "/var/lib/unbound/root.hints"

    # ===== SECURITY HARDENING =====
    hide-identity: yes
    hide-version: yes
    unwanted-reply-threshold: 10000
    do-not-query-localhost: yes
    harden-large-queries: yes

    # ===== STATISTICS =====
    extended-statistics: yes
    statistics-cumulative: yes
    statistics-interval: 0
    val-permissive-mode: no
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1

